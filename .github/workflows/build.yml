# Every push to dev and every pull request: the tests pass, and both apps build.
# main is skipped: only make publish pushes to it, and the tag it pushes right after runs release.yml, which tests and builds too.
# A change to the landing page alone (docs/) builds nothing; GitHub Pages publishes it.
name: Build

on:
  push:
    branches: [dev]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: make test

      - name: Build debug APKs
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: pocora-debug-apks
          path: android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
