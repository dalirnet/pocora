# Every push and pull request: the presets are up to date, the tests pass, and both apps build.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # presets.json is written from preset/ by make presets. A change to preset/ must be followed by it.
      - name: Presets are up to date
        run: |
          make presets
          git diff --exit-code -- app/src/main/assets/presets.json

      - name: Test
        run: make test

      - name: Build debug APKs
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: pocora-debug-apks
          path: android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
