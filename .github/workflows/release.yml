# A version tag, such as v1.2.0, builds both apps signed and minified and publishes them as a GitHub Release.
# make publish (android/scripts/publish.sh) makes the tag, after writing the same version into android/version.properties.
#
# Needs four repository secrets:
#   POCORA_KEYSTORE_BASE64    the release keystore, base64-encoded
#   POCORA_KEYSTORE_PASSWORD  its password
#   POCORA_KEY_ALIAS          the key's alias
#   POCORA_KEY_PASSWORD       the key's password
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The apps carry the version from android/version.properties. The tag must name the same one.
      - name: Tag matches the version
        run: |
          version="$(sed -n 's/^versionName=//p' version.properties)"
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match versionName $version in version.properties."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      # The same key must sign every release, or Android refuses to update the installed app.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.POCORA_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "The POCORA_KEYSTORE_BASE64 secret is missing."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "POCORA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          POCORA_KEYSTORE_PASSWORD: ${{ secrets.POCORA_KEYSTORE_PASSWORD }}
          POCORA_KEY_ALIAS: ${{ secrets.POCORA_KEY_ALIAS }}
          POCORA_KEY_PASSWORD: ${{ secrets.POCORA_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache assembleRelease
          mkdir -p "$RUNNER_TEMP/out"
          for role in child parent; do
            cp app/build/outputs/apk/$role/release/*.apk "$RUNNER_TEMP/out/pocora-$role-$VERSION.apk"
            # The same file under a name without the version, so the landing page in docs/ can link straight to the newest one:
            # https://github.com/<repo>/releases/latest/download/pocora-<role>.apk
            cp app/build/outputs/apk/$role/release/*.apk "$RUNNER_TEMP/out/pocora-$role.apk"
          done
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk > SHA256SUMS.txt)
          ls -l "$RUNNER_TEMP/out"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pocora $VERSION" \
            --generate-notes

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
